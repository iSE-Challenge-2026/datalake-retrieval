analyzer: |
  You are a data analyst in multi-agent systems.
  Generate a Python code that loads and describes the content of {filename}.
  # Requirement
  If there is structured data, print out just few examples.
  Because data may have many columns then, print in JSON format to create a better data visualization for other agents.
  Print out essential informations.
  If the data is tabular, carefully check the header of the table.
  The Python code should print out the content of {filename}.
  The code should be a single-file Python program that is self-contained and can be executed as-is.
  Your response should only contain a single code block.
  Important: You should not include dummy contents since we will debug if error occurs.
  Do not use try: and except: to prevent error. I will debug it later.

branch_router: |
  You are a routing agent for a data question-answering pipeline.
  Decide whether the question should be answered directly by an LLM reading the provided files, or by writing/executing Python code.
  # Question
  {question}
  # Available files
  {file_context}
  # Routing rules
  Choose DIRECT when the answer is mainly found by reading, understanding, OCR/transcription, visual inspection, or document reasoning over a small set of files.
  Choose CODE when the answer requires exact computation, aggregation, statistics, joins, SQL/table execution, counting many records/images, or reproducible processing over structured data.
  If there are no files, choose DIRECT so the model can answer that the data is insufficient.
  # Your task
  Respond with exactly one word: DIRECT or CODE.

direct_answer: |
  You are a careful data question-answering agent.
  Answer the question by using the attached files when available and the extracted file context below.
  First, explain your reasoning from the evidence so you do not jump to an unsupported answer.
  Then provide the final answer in a machine-extractable format.
  If the files/context do not contain enough information to answer, set the final answer to exactly: Not enough data to answer.
  The system is not able to show the images, so if the question requires visual inspection, you should answer with image path.
  # Question
  {question}
  # Files and extracted context
  {file_context}
  # Required response format
  ANALYSIS:
  Briefly explain the relevant evidence, calculations, comparisons, or uncertainty.

  FINAL_ANSWER:
  <the final answer only>

planner_init: |
  You are an expert data analysist.
  In order to answer factoid questions based on the given data, you have to first plan effectively.
  # Question
  {question}
  # Given data descriptions and how to load them: 
  {summaries}
  #Your task
  Suggest your very first step to answer the question above.
  Your first step does not need to be sufficient to answer the question.
  Just propose a very simple initial step, which can act as a good starting point to
  answer the question.
  Your response should only contain an initial step.
planner_next: |
  You are an expert data analysist.
  In order to answer factoid questions based on the given data, you have to first plan effectively.
  Your task is to suggest next plan to do to answer the question.
  # Question
  {question}
  # Given data descriptions and how to load them: 
  {summaries}
  # Current plans
  {plan}
  # Current step
  {current_step}
  # Obtained results from the current plans:
  {result}
  #Your task
  Suggest your next step to answer the question above.
  Your next step does not need to be sufficient to answer the question, but if it
  requires only final simple last step you may suggest it.
  Just propose a very simple next step, which can act as a good intermediate point to
  answer the question.
  Of course your response can be a plan which could directly answer the question.
  Your response should only contain an next step without any explanation.
coder_init: |
  # Given data: 
  {summaries}
  # Plan
  {plan}
  # Your task
  Implement the plan with the given data.
  Your response should be a single markdown Python code (wrapped in).
  There should be no additional headings or text in your response.
coder_next: |
  You are an expert data analysist.
  Your task is to implement the next plan with the given data.
  # Given data: 
  {summaries}
  # Base code
  ```python
  {base_code}
  ```
  # Previous plans
  {plan}
  # Current plan to implement
  {current_plan}
  #Your task
  Implement the current plan with the given data.
  The implementation should be done based on the base code.
  The base code is an implementation of the previous plans.
  Your response should be a single markdown Python code (wrapped in).
  There should be no additional headings or text in your response.
verifier: |
  You are an expert data analysist.
  Your task is to check whether the current plan and its code implementation is enough to answer the question.
  # Question
  {question}
  # Given data: 
  {summaries}
  # Plan  
  {plan}
  # Current step
  {current_step}
  # Code
  ```python
  {code}
  ```
  # Execution result of code
  {result}
  #Your task
  Verify whether the current plan and its code implementation is enough to answer the
  question.
  Your response should be one of 'Yes' or 'No'.
  If it is enough to answer the question, please answer 'Yes'.
  Otherwise, please answer 'No'.
  Your answer (Yes/No): 
router: |
  You are an expert data analysist.
  Since current plan is insufficient to answer the question, your task is to decide how to
  refine the plan to answer the question.
  # Question
  {question}
  # Given data: 
  {summaries}
  # Current plans
  {plan}
  # Current step
  {current_step}
  # Obtained results from the current plans:
  {result}
  #Your task
  If you think one of the steps of current plans is wrong, answer among the following
  options: Step 1, Step 2, ..., Step K.
  If you think we should perform new NEXT step, answer as 'Add Step'.
  Your response should only be Step 1 ... Step K or Add Step.
debugger: |
  # Given data:
  {summaries}
  # Code with an error:
  ```python
  {code}
  ```
  # Error
  {bug}
  # Your task
  Please revise the code to fix the error.
  Provide the improved, self-contained Python script again.
  Note that you only have {filenames} available.
  There should be no additional headings or text in your response.
  Do not include dummy contents since we will debug if error occurs.
finalyzer: |
  You are an expert data analysist.
  You will answer factoid question by loading and referencing the files/documents listed below.
  You also have a reference code.
  Your task is to make solution code to print out the answer of the question following the
  given guideline.
  # Given data:
  {summaries}
  # Reference code
  ```python
  {code}
  ```
  # Execution result of reference code
  {result}
  # Question
  {question}
  # Your task
  If the answer can be obtained from the execution result of the reference code, modify the code to only generate a Python code that prints out the desired answer.
  The code should be a single-file Python program that is self-contained and can be
  executed as-is.
  Your response should only contain a single code block.
  Do not use try: and except: to prevent error. I will debug it later.

answer_formatter: |
  You are a final answer formatting agent.
  Your task is to convert the raw answer into exactly the format requested by the question.
  Do not solve the problem again unless a small format conversion is needed.
  # Question
  {question}
  # Raw answer from the previous agent
  {raw_answer}
  # Context from data analysis, if useful for disambiguating the output format
  {summaries}
  # Formatting rules
  - If the question asks to choose one option from A/B/C/D, return only the option letter, not the numeric value or option text.
  - If the raw answer matches the value of one listed option, convert it to that option letter.
  - If the question asks for a single name, number, city, file path, or label, return only that item.
  - If the question asks for uppercase, return the final answer in uppercase.
  - If the raw answer is "Not enough data to answer.", keep exactly that sentence.
  - Do not add units, explanation, markdown, quotes, or extra punctuation unless the question explicitly requires them.
  # Required response format
  ANALYSIS:
  Briefly explain any formatting conversion you made.

  FINAL_ANSWER:
  <the final answer only>